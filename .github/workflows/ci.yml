name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Match composer.json `config.platform.php` and the production
          # Dockerfile (php:8.4-fpm) — 8.3 fails the platform check.
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      # The shared `courtly/ai-client` package is a VCS repository; if it is
      # private, provide a read token via the COMPOSER_AUTH secret.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint & format
        run: php vendor/bin/pint --test

      - name: Run tests
        run: php vendor/bin/pest
