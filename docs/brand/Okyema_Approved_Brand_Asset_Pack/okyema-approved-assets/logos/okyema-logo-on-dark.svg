<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280"><svg x="20" y="20" width="240" height="240" viewBox="0 0 512 512">
  <title id="title">Okyema folded O K monogram</title>
  <desc id="desc">Approved interlocking ribbon mark in cyan, blue and violet.</desc>
  <defs>
    <linearGradient id="field" x1="52" y1="78" x2="468" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22E3E8"/>
      <stop offset=".48" stop-color="#388CF8"/>
      <stop offset="1" stop-color="#7457FF"/>
    </linearGradient>
    <linearGradient id="innerTop" x1="226" y1="295" x2="375" y2="139" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22E3E8"/>
      <stop offset=".58" stop-color="#3B9CF8"/>
      <stop offset="1" stop-color="#5362F7"/>
    </linearGradient>
    <linearGradient id="innerBottom" x1="265" y1="271" x2="411" y2="423" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#465CF4"/>
      <stop offset="1" stop-color="#7A4FFF"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="70" y1="273" x2="185" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28DCEB"/>
      <stop offset="1" stop-color="#3188F4"/>
    </linearGradient>
    <linearGradient id="lowerFacet" x1="300" y1="389" x2="390" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3130A7"/>
      <stop offset="1" stop-color="#5544D5"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="224"/></clipPath>
    <filter id="softEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation=".22"/>
    </filter>
  </defs>
  <g clip-path="url(#disc)" filter="url(#softEdge)">
    <circle cx="256" cy="256" r="224" fill="url(#field)"/>
    <!-- outer folded O/K cut: approved broad descending black ribbon -->
    <path d="M286 35 L357 92 L188 260 L188 333 L339 483 L271 489 L118 338 L118 217 Z" fill="#0B1020"/>
    <!-- cyan-blue facet visible where the outer ribbon turns inward -->
    <path d="M118 217 L188 148 L188 260 L118 329 Z" fill="url(#leftFacet)"/>
    <!-- upper black return fold -->
    <path d="M286 35 L357 92 L235 214 L188 260 L188 148 Z" fill="#0B1020"/>
    <!-- inner upper coloured stroke -->
    <path d="M334 118 L390 174 L235 329 L180 273 Z" fill="url(#innerTop)"/>
    <!-- right negative-space counter -->
    <path d="M390 174 L390 334 L350 374 L266 289 Z" fill="#0B1020"/>
    <!-- lower return stroke -->
    <path d="M266 289 L421 444 L350 486 L211 346 Z" fill="url(#innerBottom)"/>
    <!-- shaded overlap at the lower outer fold -->
    <path d="M339 483 L271 489 L319 441 L350 472 Z" fill="url(#lowerFacet)" opacity=".9"/>
  </g>
</svg><text x="305" y="175" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="118" font-weight="500" letter-spacing="28">OKYEMA</text><text x="310" y="226" fill="#FFFFFF" opacity=".68" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" letter-spacing="4">YOUR INTELLIGENT CHIEF OF STAFF</text></svg>